[package]
name = "alice-audit"
version = "1.3.0"
edition = "2021"
authors = ["Moroya Sakamoto <sakamoro@alicelaw.net>"]
description = "Audit trail with hash-chain tamper detection, SHA-256 + Ed25519 signed events, and Merkle root anchoring"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# `version` は publish に必須 (path だけだと `cargo package` が
# "all dependencies must have a version requirement specified when packaging" で落ちる)
# publish 時は `path` が外れて version 要求だけが残るので、値は相手の実 version に合わせる
alice-sign = { version = "0.1", git = "https://github.com/ext-sakamoro/ALICE-Sign", rev = "6b79a0bad3db4c7de1719251d6a2a9405fbc0ee2", features = ["vc"] }
