name: 'ALICE-Audit Optional Bridge Stubs'
description: |
  ALICE-Audit depends on 1 ALICE-* sibling crate (alice-blockchain) via
  workspace-relative path dep. In CI runners the sibling is not present,
  so this composite action fabricates a minimal stub Cargo.toml + src/lib.rs
  exposing the subset of `alice-blockchain` symbols that `alice-audit`
  actually uses (hash_data / Hash / KeyPair / MerkleTree / MerkleProof /
  PublicKey / Signature / VerifiableCredential / VerifiableCredentialBuilder)
  so that cargo-deny / cargo-audit / cargo-machete / cargo-llvm-cov /
  cargo-semver-checks / cargo-fuzz can resolve and compile the graph.

  Every generated Cargo.toml must include `license = "MIT OR Apache-2.0"`
  to avoid cargo-deny reject (canonical trap #2).

  The stub is *not* cryptographically valid — it exists solely to unblock
  build / lint / audit / fuzz-build pipelines. Fuzz targets in this repo
  deliberately exercise the legacy `AuditTrail` API which does not depend
  on `alice-blockchain`, so runtime correctness is unaffected.

  Canonical CI template: [[reference_alice_ci_canonical_template]]

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # alice-blockchain rich stub (real API used by src/signed_trail.rs)
        mkdir -p "../ALICE-Blockchain/src"
        cat > "../ALICE-Blockchain/Cargo.toml" <<'TOML'
        [package]
        name = "alice-blockchain"
        version = "0.1.0"
        edition = "2021"
        license = "MIT OR Apache-2.0"

        [lib]
        path = "src/lib.rs"
        TOML

        cat > "../ALICE-Blockchain/src/lib.rs" <<'RS'
        //! Minimal stub of `alice-blockchain` for CI resolution only.
        //! NOT cryptographically valid — see .github/actions/alice-stubs/action.yml.

        #![allow(clippy::all, dead_code, unused_variables)]

        #[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]
        pub struct Hash(pub [u8; 32]);

        impl Hash {
            #[must_use]
            pub const fn zero() -> Self { Self([0u8; 32]) }
            #[must_use]
            pub const fn from_bytes(bytes: [u8; 32]) -> Self { Self(bytes) }
        }

        #[must_use]
        pub fn hash_data(_data: &[u8]) -> Hash { Hash([0u8; 32]) }

        #[derive(Debug, Clone, Copy, PartialEq, Eq, Default)]
        pub struct PublicKey(pub [u8; 32]);

        impl PublicKey {
            #[must_use]
            pub fn verify(&self, _message: &[u8], _signature: &Signature) -> bool { true }
        }

        #[derive(Debug, Clone, Copy)]
        pub struct Signature(pub [u8; 64]);

        impl Default for Signature {
            fn default() -> Self { Self([0u8; 64]) }
        }

        impl PartialEq for Signature {
            fn eq(&self, other: &Self) -> bool { self.0[..] == other.0[..] }
        }
        impl Eq for Signature {}

        #[derive(Debug, Clone)]
        pub struct KeyPair {
            _private: [u8; 32],
            _public: PublicKey,
        }

        impl KeyPair {
            #[must_use]
            pub fn from_seed(seed: [u8; 32]) -> Self {
                Self { _private: seed, _public: PublicKey(seed) }
            }
            #[must_use]
            pub fn public(&self) -> PublicKey { self._public }
            #[must_use]
            pub fn sign(&self, _message: &[u8]) -> Signature { Signature([0u8; 64]) }
        }

        #[derive(Debug, Clone, Default)]
        pub struct MerkleTree {
            leaves: Vec<Hash>,
        }

        impl MerkleTree {
            #[must_use]
            pub fn build(leaves: &[Hash]) -> Self {
                Self { leaves: leaves.to_vec() }
            }
            #[must_use]
            pub fn root(&self) -> Hash {
                self.leaves.first().copied().unwrap_or_else(Hash::zero)
            }
            #[must_use]
            pub fn prove(&self, index: usize) -> Option<MerkleProof> {
                if index >= self.leaves.len() { return None; }
                Some(MerkleProof { hashes: Vec::new() })
            }
        }

        #[derive(Debug, Clone, Default)]
        pub struct MerkleProof {
            pub hashes: Vec<(Hash, bool)>,
        }

        impl MerkleProof {
            #[must_use]
            pub fn verify(&self, _leaf: Hash, _root: Hash) -> bool { true }
        }

        #[derive(Debug, Clone)]
        pub struct VerifiableCredential {
            pub id: String,
            pub issuer: String,
            pub subject: String,
            pub payload_hash: Hash,
            pub issuance_unix_seconds: u64,
            pub signer_public: PublicKey,
            pub signature: Signature,
        }

        impl VerifiableCredential {
            #[must_use]
            pub fn verify(&self) -> bool { true }
        }

        pub struct VerifiableCredentialBuilder {
            id: String,
            issuer: String,
            subject: String,
            payload_hash: Hash,
            issuance_unix_seconds: u64,
        }

        impl VerifiableCredentialBuilder {
            #[must_use]
            pub fn new(
                id: impl Into<String>,
                issuer: impl Into<String>,
                subject: impl Into<String>,
                payload_hash: Hash,
                issuance_unix_seconds: u64,
            ) -> Self {
                Self {
                    id: id.into(),
                    issuer: issuer.into(),
                    subject: subject.into(),
                    payload_hash,
                    issuance_unix_seconds,
                }
            }

            #[must_use]
            pub fn build_signed(self, signer: &KeyPair) -> VerifiableCredential {
                VerifiableCredential {
                    id: self.id,
                    issuer: self.issuer,
                    subject: self.subject,
                    payload_hash: self.payload_hash,
                    issuance_unix_seconds: self.issuance_unix_seconds,
                    signer_public: signer.public(),
                    signature: Signature([0u8; 64]),
                }
            }
        }
        RS

        echo "alice-stubs: fabricated ../ALICE-Blockchain (alice-blockchain rich stub)"
