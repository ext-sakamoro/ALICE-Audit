name: CI

# 2026-09-15 強化 (それまで fmt + actionlint のみで test / clippy / doc は CI 未実行):
# - test / clippy `--all-targets` (pedantic は 0 件なので最初から `-D warnings` gate) / doc `-D warnings`
# - path 依存は無い (Ed25519 / SHA-256 / Merkle / 資格証明は公開の alice-sign を git rev で引く)
# - feature 0 なので powerset 不要、no_std claim なし

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test

  clippy:
    name: Clippy (all targets, pedantic, -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-Dwarnings"

  actionlint:
    name: actionlint (workflow YAML 検証)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
          reporter: github-check

  test-public-siblings:
    name: Test (public siblings)
    runs-on: ubuntu-latest
    env:
      # the passed-test count of the feature set below at the commit that set it;
      # fewer passed tests (a removed or skipped test, or none at all) is a failure
      MIN_PASSED: "126"
    steps:
      # cargo reads the manifest of every path dependency, optional ones included, so
      # each sibling is checked out next to this repository at a fixed commit with the
      # workflow's own token: a sibling that is not public cannot be checked out
      - uses: actions/checkout@v5
        with:
          path: ALICE-Audit
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (lib, integration, doctests)
        working-directory: ALICE-Audit
        run: |
          # the default shell has no pipefail: without it cargo's exit status is lost in the pipe
          set -o pipefail
          log="$(mktemp)"
          cargo test --all-features 2>&1 | tee "${log}"
          passed=$(grep -E '^test result: ' "${log}" | awk '{s += $4} END {print s + 0}')
          failed=$(grep -E '^test result: ' "${log}" | awk '{s += $6} END {print s + 0}')
          echo "passed: ${passed} (minimum ${MIN_PASSED}), failed: ${failed}"
          if [ "${failed}" -ne 0 ] || grep -E '^test result: ' "${log}" | grep -vE '^test result: ok\. ' >/dev/null; then
            echo "::error::${failed} tests failed"
            exit 1
          fi
          if [ "${passed}" -lt "${MIN_PASSED}" ]; then
            echo "::error::${passed} tests passed, fewer than ${MIN_PASSED}"
            exit 1
          fi
